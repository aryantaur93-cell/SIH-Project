<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 140" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="logoIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061a14"/>
      <stop offset="50%" stop-color="#0b2921"/>
      <stop offset="100%" stop-color="#041410"/>
    </linearGradient>

    <linearGradient id="logoEmeraldMint" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="logoMintBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <linearGradient id="logoWmText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2f5ec"/>
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ==================== SQUARE APP-STYLE ICON (LEFT) ==================== -->
  <g transform="translate(10, 10)">
    <!-- Squircle container -->
    <rect width="120" height="120" rx="28" fill="url(#logoIconBg)"/>
    <rect width="118" height="118" x="1" y="1" rx="27" fill="none" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.3"/>

    <!-- Topographic contour curves -->
    <g opacity="0.16" stroke="#34d399" stroke-width="1.2" fill="none">
      <path d="M 12 85 C 32 75, 55 90, 80 78 C 98 70, 106 75, 112 70"/>
      <path d="M 12 60 C 35 52, 60 68, 85 58 C 100 50, 108 55, 112 50"/>
      <path d="M 15 35 C 38 28, 65 42, 90 32 C 102 26, 108 30, 112 25"/>
    </g>

    <!-- 8 State Nodes (Northeast India) -->
    <g fill="#6ee7b7">
      <circle cx="34" cy="40" r="1.8" opacity="0.7"/>
      <circle cx="52" cy="32" r="2.2" opacity="0.85"/>
      <circle cx="78" cy="38" r="2" opacity="0.75"/>
      <circle cx="92" cy="54" r="2" opacity="0.7"/>
      <circle cx="86" cy="76" r="2" opacity="0.75"/>
      <circle cx="72" cy="85" r="1.8" opacity="0.7"/>
      <circle cx="58" cy="82" r="2" opacity="0.7"/>
      <circle cx="36" cy="74" r="2" opacity="0.75"/>
    </g>

    <!-- NE Monogram Bars -->
    <!-- Left Pillar of N -->
    <rect x="28" y="32" width="12" height="56" rx="4" fill="url(#logoEmeraldMint)"/>

    <!-- E Horizontal Corridor Arms -->
    <rect x="70" y="32" width="22" height="10" rx="3" fill="url(#logoEmeraldMint)"/>
    <rect x="66" y="55" width="20" height="9" rx="2.5" fill="url(#logoEmeraldMint)"/>
    <rect x="70" y="78" width="22" height="10" rx="3" fill="url(#logoEmeraldMint)"/>
    <rect x="65" y="32" width="10" height="56" rx="3" fill="url(#logoEmeraldMint)"/>

    <!-- The "X" Expressway Crossing -->
    <path d="M 37 34 L 79 84" stroke="#059669" stroke-width="11" stroke-linecap="round"/>
    <path d="M 37 84 L 81 35" stroke="url(#logoMintBright)" stroke-width="11" stroke-linecap="round"/>
    <path d="M 40 81 L 78 38" stroke="#ffffff" stroke-width="2.2" stroke-dasharray="5 4" stroke-linecap="round"/>

    <!-- AI Transit Center Node -->
    <circle cx="59" cy="59" r="6.5" fill="#061a14" stroke="#6ee7b7" stroke-width="2"/>
    <circle cx="59" cy="59" r="3" fill="#34d399" filter="url(#logoGlow)"/>
  </g>

  <!-- ==================== NEXTRA WORDMARK (RIGHT) ==================== -->
  <g transform="translate(155, 14)">
    <!-- Glyphs for NEXTRA (N, E, T, R, A) in Crisp White/Mint -->
    <g fill="url(#logoWmText)">
      <!-- N -->
      <path d="M 0 16 L 15 16 L 15 50 L 47 16 L 63 16 L 63 70 L 48 70 L 48 35 L 16 70 L 0 70 Z"/>

      <!-- E -->
      <path d="M 82 16 L 126 16 L 126 29 L 98 29 L 98 37 L 122 37 L 122 50 L 98 50 L 98 57 L 127 57 L 127 70 L 82 70 Z"/>

      <!-- T -->
      <path d="M 226 16 L 278 16 L 278 29 L 260 29 L 260 70 L 244 70 L 244 29 L 226 29 Z"/>

      <!-- R -->
      <path d="M 295 16 L 328 16 C 340 16 348 23 348 34 C 348 42 342 48 333 50 L 351 70 L 333 70 L 317 52 L 311 52 L 311 70 L 295 70 Z M 311 28 L 311 41 L 326 41 C 331 41 334 38 334 34 C 334 30 331 28 326 28 Z"/>

      <!-- A -->
      <path d="M 376 16 L 392 16 L 417 70 L 401 70 L 395 56 L 372 56 L 366 70 L 350 70 Z M 384 29 L 377 44 L 391 44 Z"/>
    </g>

    <!-- THE "X" (Dynamic Transit Crossroads) -->
    <g>
      <path d="M 143 70 L 207 16" stroke="url(#logoEmeraldMint)" stroke-width="14" stroke-linecap="round"/>
      <path d="M 143 16 L 207 70" stroke="url(#logoMintBright)" stroke-width="14" stroke-linecap="round"/>
      <path d="M 147 66 L 203 20" stroke="#06221b" stroke-width="2.8" stroke-dasharray="6 4" stroke-linecap="round"/>
      <path d="M 147 20 L 203 66" stroke="#ffffff" stroke-width="2.8" stroke-dasharray="6 4" stroke-linecap="round" opacity="0.9"/>
      <circle cx="175" cy="43" r="7.5" fill="#061a14" stroke="#6ee7b7" stroke-width="2"/>
      <circle cx="175" cy="43" r="3" fill="#34d399" filter="url(#logoGlow)"/>
    </g>

    <!-- Tagline underneath with generous spacing -->
    <text x="0" y="96"
          font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="11"
          font-weight="700"
          letter-spacing="2.2"
          fill="#34d399">
      NE REGION X-INTELLIGENT TRANSPORT &amp; ROUTING ASSISTANT
    </text>

    <!-- SIH 2026 Badge -->
    <rect x="436" y="24" width="76" height="22" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.2"/>
    <text x="474" y="39" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#6ee7b7">SIH 2026</text>

    <!-- VoidX Trademark Badge -->
    <rect x="520" y="24" width="78" height="22" rx="6" fill="#059669" fill-opacity="0.25" stroke="#34d399" stroke-width="1.2"/>
    <text x="559" y="39" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#34d399">VoidX™</text>
  </g>
</svg>

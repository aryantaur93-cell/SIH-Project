<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="hillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="mudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="60%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>

  <!-- Rainy Mountain Sky -->
  <rect width="400" height="240" fill="url(#skyGrad)"/>
  
  <!-- Rain Striations -->
  <g stroke="#94a3b8" stroke-width="1" opacity="0.3">
    <line x1="20" y1="10" x2="10" y2="40"/>
    <line x1="80" y1="5" x2="70" y2="35"/>
    <line x1="140" y1="20" x2="130" y2="50"/>
    <line x1="220" y1="15" x2="210" y2="45"/>
    <line x1="300" y1="8" x2="290" y2="38"/>
    <line x1="360" y1="18" x2="350" y2="48"/>
  </g>

  <!-- Mountain Slopes -->
  <path d="M 0 140 Q 90 90 200 130 T 400 110 L 400 240 L 0 240 Z" fill="url(#hillGrad)"/>

  <!-- Tarmac Highway Cut -->
  <path d="M 0 195 L 400 175 L 400 240 L 0 240 Z" fill="#1e293b"/>
  <!-- Broken Road Divider -->
  <path d="M 40 210 L 140 200" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Landslide Mud & Debris Flow -->
  <path d="M 120 120 Q 180 140 220 175 Q 260 210 320 230 L 150 240 Q 110 200 120 120 Z" fill="url(#mudGrad)"/>

  <!-- Giant Boulders Blocking Way -->
  <ellipse cx="210" cy="195" rx="26" ry="18" fill="#57534e" stroke="#292524" stroke-width="2"/>
  <ellipse cx="245" cy="205" rx="34" ry="22" fill="#78716c" stroke="#292524" stroke-width="2"/>
  <ellipse cx="180" cy="212" rx="20" ry="14" fill="#44403c" stroke="#292524" stroke-width="1.5"/>
  <ellipse cx="275" cy="216" rx="22" ry="15" fill="#57534e" stroke="#292524" stroke-width="1.5"/>

  <!-- Caution Marker Post / Warning Tape -->
  <line x1="150" y1="180" x2="290" y2="170" stroke="#ef4444" stroke-width="3" stroke-dasharray="10 4"/>
  
  <!-- GPS / Evidence Watermark Stamp -->
  <rect x="10" y="10" width="175" height="42" rx="6" fill="#000000" fill-opacity="0.65"/>
  <text x="18" y="26" font-family="monospace" font-size="10" font-weight="700" fill="#34d399">GPS: 25.1000°N 92.3500°E</text>
  <text x="18" y="42" font-family="monospace" font-size="9" fill="#e2e8f0">NH-6 SONAPUR TUNNEL</text>

  <!-- AI Detection Overlay Box -->
  <rect x="150" y="165" width="165" height="65" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="150" y="150" width="135" height="15" rx="3" fill="#ef4444"/>
  <text x="154" y="161" font-family="monospace" font-size="9" font-weight="700" fill="#ffffff">AI: LANDSLIDE 94.2%</text>
</svg>

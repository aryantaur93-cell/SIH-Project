<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061a14"/>
      <stop offset="100%" stop-color="#0b2921"/>
    </linearGradient>
    <linearGradient id="favEmerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="favMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#favBg)"/>
  <rect width="62" height="62" x="1" y="1" rx="14" fill="none" stroke="#34d399" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Left pillar of N -->
  <rect x="14" y="15" width="8" height="34" rx="3" fill="url(#favEmerald)"/>

  <!-- E horizontal arms -->
  <rect x="36" y="15" width="14" height="6" rx="2" fill="url(#favEmerald)"/>
  <rect x="34" y="29" width="13" height="6" rx="2" fill="url(#favEmerald)"/>
  <rect x="36" y="43" width="14" height="6" rx="2" fill="url(#favEmerald)"/>
  <rect x="34" y="15" width="7" height="34" rx="2" fill="url(#favEmerald)"/>

  <!-- The "X" Transit Crossing Slashing Through -->
  <path d="M 18 16 L 44 47" stroke="#059669" stroke-width="7" stroke-linecap="round"/>
  <path d="M 19 46 L 45 17" stroke="url(#favMint)" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Dashed Route Lane -->
  <path d="M 21 44 L 43 19" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="3 3" stroke-linecap="round"/>

  <!-- AI Route Pulse Node -->
  <circle cx="32" cy="31.5" r="4.5" fill="#061a14" stroke="#6ee7b7" stroke-width="1.5"/>
  <circle cx="32" cy="31.5" r="2.2" fill="#34d399"/>
</svg>

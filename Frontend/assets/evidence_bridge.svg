<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="lakeWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="bridgeConcrete" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- Blue Sky -->
  <rect width="400" height="150" fill="#bae6fd"/>
  <!-- Green Hills in Distance -->
  <path d="M 0 130 Q 120 70 240 110 T 400 90 L 400 170 L 0 170 Z" fill="#15803d" opacity="0.6"/>
  <!-- Umiam Lake Water -->
  <rect y="140" width="400" height="100" fill="url(#lakeWater)"/>

  <!-- Viaduct Bridge Deck & Pillars -->
  <rect x="60" y="140" width="28" height="80" fill="url(#bridgeConcrete)"/>
  <rect x="180" y="140" width="28" height="80" fill="url(#bridgeConcrete)"/>
  <rect x="300" y="140" width="28" height="80" fill="url(#bridgeConcrete)"/>
  <rect x="0" y="130" width="400" height="18" rx="2" fill="#334155"/>
  <rect x="0" y="122" width="400" height="8" fill="#94a3b8"/>

  <!-- Moving Freight Truck on Bridge -->
  <rect x="190" y="108" width="55" height="18" rx="3" fill="#059669"/>
  <rect x="230" y="112" width="22" height="14" rx="2" fill="#0f766e"/>
  <circle cx="205" cy="128" r="4" fill="#0f172a"/>
  <circle cx="240" cy="128" r="4" fill="#0f172a"/>

  <!-- Watermark -->
  <rect x="10" y="10" width="165" height="42" rx="6" fill="#000000" fill-opacity="0.65"/>
  <text x="18" y="26" font-family="monospace" font-size="10" font-weight="700" fill="#10b981">GPS: 25.5900°N 91.9300°E</text>
  <text x="18" y="42" font-family="monospace" font-size="9" fill="#e2e8f0">UMIAM VIADUCT NH-6</text>

  <!-- AI Bounding Box -->
  <rect x="175" y="100" width="90" height="42" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="175" y="88" width="105" height="15" rx="3" fill="#10b981"/>
  <text x="179" y="99" font-family="monospace" font-size="9" font-weight="700" fill="#ffffff">AI: VERIFIED 96.1%</text>
</svg>

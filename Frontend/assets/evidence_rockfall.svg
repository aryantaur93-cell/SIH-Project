<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="gorgeSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="rockCliff" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#gorgeSky)"/>

  <!-- Steep Gorge Mountain Cliff -->
  <polygon points="0,0 220,0 120,240 0,240" fill="url(#rockCliff)"/>
  
  <!-- Retaining Wire Mesh -->
  <g stroke="#a1a1aa" stroke-width="0.8" opacity="0.6">
    <line x1="30" y1="20" x2="110" y2="180"/>
    <line x1="60" y1="20" x2="140" y2="180"/>
    <line x1="90" y1="20" x2="170" y2="180"/>
    <line x1="120" y1="20" x2="200" y2="180"/>
    <line x1="10" y1="60" x2="180" y2="60"/>
    <line x1="20" y1="100" x2="160" y2="100"/>
    <line x1="30" y1="140" x2="140" y2="140"/>
  </g>

  <!-- Highway & Teesta River Verge -->
  <polygon points="120,240 220,0 400,0 400,240" fill="#334155"/>
  <polygon points="260,240 330,0 400,0 400,240" fill="#0284c7" opacity="0.4"/>

  <!-- Fallen Rocks on Tarmac -->
  <polygon points="175,190 190,180 205,195 190,205" fill="#52525b"/>
  <polygon points="210,195 235,185 240,210 220,215" fill="#71717a"/>
  <polygon points="160,205 180,200 175,220" fill="#3f3f46"/>

  <!-- Watermark -->
  <rect x="10" y="10" width="165" height="42" rx="6" fill="#000000" fill-opacity="0.65"/>
  <text x="18" y="26" font-family="monospace" font-size="10" font-weight="700" fill="#38bdf8">GPS: 27.0800°N 88.4800°E</text>
  <text x="18" y="42" font-family="monospace" font-size="9" fill="#e2e8f0">NH-10 TEESTA GORGE</text>

  <!-- AI Bounding Box -->
  <rect x="155" y="175" width="105" height="50" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="155" y="162" width="115" height="15" rx="3" fill="#f59e0b"/>
  <text x="159" y="173" font-family="monospace" font-size="9" font-weight="700" fill="#ffffff">AI: ROCKFALL 88.6%</text>
</svg>
